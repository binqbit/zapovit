[workspace]
members = ["crates/domain", "crates/application", "crates/adapters", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain", version = "=0.1.0" }
application = { path = "crates/application", version = "=0.1.0" }
adapters = { path = "crates/adapters", version = "=0.1.0" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "io-util", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing"] }
thiserror = "2"
async-trait = "0.1"
zeroize = { version = "=1.9.0", features = ["derive"] }
secrecy = "=0.10.3"
getrandom = "=0.4.3"
argon2 = "=0.6.0"
chacha20poly1305 = "=0.11.0"
hmac = "=0.13.0"
sha2 = "=0.11.0"
vsss-rs = { version = "=6.0.1", default-features = false, features = ["std", "zeroize"] }
rand_core = "=0.10.1"
base64 = "0.22"
hex = "0.4"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "time", "json", "macros", "migrate"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
teloxide-core = { version = "=0.13.0", default-features = false, features = ["rustls"] }
aws-sdk-s3 = { version = "=1.145.0", default-features = false, features = ["default-https-client", "rt-tokio", "http-1x"] }
aws-credential-types = "=1.3.0"
fluent-bundle = "=0.16.0"
unic-langid = "=0.9.6"
fluent-langneg = "=0.13.1"
config = { version = "=0.15.25", default-features = false, features = ["toml"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
axum = "=0.8.9"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
tempfile = "3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
